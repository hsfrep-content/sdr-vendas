<title>A&L Match Imobiliário</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#F7F5F1; --surface:#FFFFFF; --ink:#1C2536; --muted:#5C6675; --line:#E4E0D8;
  --navy:#1E3A5F; --navy-deep:#14293F; --red:#A93F35; --gold:#8A7B5C;
  --ok:#2E6B4F; --warn:#8A6A1F; --bad:#A93F35; --chip:#EFECE5;
  --shadow:0 1px 2px rgba(28,37,54,.06),0 8px 24px rgba(28,37,54,.07);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141922; --surface:#1C2330; --ink:#E9E6DF; --muted:#9AA3B2; --line:#2B3444;
  --navy:#7FA6D0; --navy-deep:#0F1621; --red:#D4796F; --gold:#B3A47F;
  --ok:#6FBF97; --warn:#D3B25E; --bad:#D4796F; --chip:#232C3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --btn-ink:#10202F;
}}
:root[data-theme="light"]{
  --btn-ink:#fff; --bg:#F7F5F1; --surface:#FFFFFF; --ink:#1C2536; --muted:#5C6675; --line:#E4E0D8;
  --navy:#1E3A5F; --navy-deep:#14293F; --red:#A93F35; --gold:#8A7B5C;
  --ok:#2E6B4F; --warn:#8A6A1F; --bad:#A93F35; --chip:#EFECE5;
  --shadow:0 1px 2px rgba(28,37,54,.06),0 8px 24px rgba(28,37,54,.07);
}
:root[data-theme="dark"]{
  --bg:#141922; --surface:#1C2330; --ink:#E9E6DF; --muted:#9AA3B2; --line:#2B3444;
  --navy:#7FA6D0; --navy-deep:#0F1621; --red:#D4796F; --gold:#B3A47F;
  --ok:#6FBF97; --warn:#D3B25E; --bad:#D4796F; --chip:#232C3B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); --btn-ink:#10202F;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{line-height:1.2;text-wrap:balance;margin:0 0 .5rem;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,4.5vw,3rem);font-weight:650}
h2{font-size:1.35rem;font-weight:640}
h3{font-size:1.05rem;font-weight:620}
p{margin:.35rem 0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:640}
.wrap{max-width:1060px;margin:0 auto;padding:0 20px}
a{color:var(--navy)}
button{font:inherit;cursor:pointer;border:none;border-radius:8px;transition:filter .15s, transform .1s}
button:active{transform:translateY(1px)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.btn{background:var(--navy);color:var(--btn-ink,#fff);padding:.65rem 1.25rem;font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;color:var(--navy);border:1px solid var(--navy)}
.btn.subtle{background:var(--chip);color:var(--ink)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.ok{background:var(--ok);color:#fff}
:root[data-theme="dark"] .btn.ok{color:#0e1a14}
.btn.sm{padding:.4rem .8rem;font-size:.85rem}
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:14px;height:60px}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--red)}
.brand span{color:var(--muted);font-weight:500}
.topnav{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rolebadge{font-size:.75rem;background:var(--chip);padding:.25rem .6rem;border-radius:99px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.chip{display:inline-block;font-size:.74rem;font-weight:620;padding:.18rem .6rem;border-radius:99px;background:var(--chip);color:var(--muted);letter-spacing:.02em}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.chip.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.chip.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.chip.navy{color:var(--navy);background:color-mix(in srgb,var(--navy) 12%,transparent)}
label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:.7rem 0 .2rem}
input,select,textarea{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:70px;resize:vertical}
.frow{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}

.hero .wrap{max-width:820px}
section.land{padding:44px 0;border-top:1px solid var(--line)}
.steps{counter-reset:s}

.progress i{display:block;height:100%;background:var(--navy);border-radius:99px;transition:width .3s}
.modal-bg{position:fixed;inset:0;background:rgba(15,22,33,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:24px;box-shadow:var(--shadow)}
.list{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
table{border-collapse:collapse;width:100%;font-size:.85rem}
td,th{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.scrollx{overflow-x:auto}
.private{border:1px dashed var(--gold);border-radius:10px;padding:12px 14px;margin-top:12px}
.private .eyebrow{color:var(--gold)}
.agent{border-left:3px solid var(--navy);padding:.5rem .9rem;background:var(--bg);border-radius:0 8px 8px 0;font-size:.85rem;margin:.4rem 0}
.agent b{display:block;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--navy)}
.thumb{width:74px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:var(--chip)}
.photo-slot{display:grid;place-items:center;font-size:.7rem;color:var(--muted);text-align:center}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--navy-deep);color:#EDEAE3;padding:.7rem 1.2rem;border-radius:10px;box-shadow:var(--shadow);z-index:99;font-size:.9rem;animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
footer{padding:36px 0 48px;color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);margin-top:48px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:1.6rem;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.gbtn{display:flex;align-items:center;gap:10px;justify-content:center;background:var(--surface);border:1px solid var(--line);color:var(--ink);padding:.65rem 1.2rem;font-weight:600;width:100%}
.gbtn:hover{filter:none;background:var(--chip)}
</style>
<div id="app"></div>
<script>
"use strict";
/* ============ dados & estado ============ */
const CITIES = ["Recife","Jaboatão dos Guararapes","Olinda","Paulista","Camaragibe","São Lourenço da Mata","Cabo de Santo Agostinho","Igarassu","Abreu e Lima","Moreno"];
const HOODS = ["Boa Viagem","Pina","Setúbal","Piedade","Candeias","Paiva","Barra de Jangada","Imbiribeira","Madalena","Graças","Casa Forte","Espinheiro","Outro"];
const TYPES = ["Apartamento","Casa","Sala comercial","Loja","Terreno","Studio","Cobertura","Flat","Outro"];
const REJECT_REASONS = ["CRECI não validado","Imóvel fora da área de atuação inicial","Fotos insuficientes","Informações comerciais incompletas","Valor desalinhado com mercado","Captação sem indício mínimo de autorização","Imóvel duplicado","Outro motivo"];
const PSTATUS = {analise:"Imóvel em análise",aprovado:"Ativo para match",recusado:"Imóvel recusado",complemento:"Informações insuficientes",arquivado:"Arquivado"};
const fmt = v => v? "R$ "+Number(v).toLocaleString("pt-BR") : "—";
const band = v => { if(!v) return "—"; const lo=Math.floor(v*0.94/10000)*10000, hi=Math.ceil(v*1.06/10000)*10000; return `entre ${fmt(lo)} e ${fmt(hi)}`; };
const bandArea = a => a? `${Math.floor(a*0.93/1)} a ${Math.ceil(a*1.07)} m²` : "—";
const uid = () => Math.random().toString(36).slice(2,9);

function seed(){
  return {

    users:[

      {id:"u2",name:"Rafael Lins",email:"rafael@corretor.com",phone:"(81) 98888-2020",role:"parceiro",creci:"CRECI-PE 21.877",city:"Jaboatão dos Guararapes",creciStatus:"aprovado",doc:"creci-rafael.pdf",terms:true},
      {id:"u3",name:"Equipe A&L",email:"parceria@aelimoveis.com.br",phone:"—",role:"admin",creci:"—",city:"Recife",creciStatus:"aprovado",terms:true},
      {id:"u4",name:"Carla Menezes",email:"carla@corretor.com",phone:"(81) 97777-3030",role:"captador",creci:"CRECI-PE 25.410",city:"Recife",creciStatus:"pendente",doc:"creci-carla.jpg",terms:true},
      {id:"u5",name:"João Pedro Sales",email:"jp@corretor.com",phone:"(81) 96666-4040",role:"parceiro",creci:"CRECI-PE 30.002",city:"Recife",creciStatus:"pendente",doc:"creci-jp.pdf",terms:true},
    ],
    properties:[
      prop({id:"p1",owner:"u1",purpose:"venda",type:"Apartamento",city:"Recife",hood:"Boa Viagem",area:62,bed:2,suite:1,bath:2,park:1,floor:"9º",sun:"Nascente",sale:405000,condo:780,iptu:120,status:"aprovado",vis:1,quality:86,commercial:82,addr:"Rua dos Navegantes, 1450, ap 902",bldg:"Ed. Porto das Dunas",ownerc:"Sr. Almeida · (81) 3333-0000",auth:"sim",excl:"não",listed:"sim",docsit:"Escritura registrada",occ:"Vazio",visit:"Livre com agendamento",furn:"não",comm:"50/50 sobre 5%",desc:"Apartamento reformado, quadra do mar, nascente, lazer completo."}),
      prop({id:"p2",owner:"u1",purpose:"venda",type:"Apartamento",city:"Jaboatão dos Guararapes",hood:"Piedade",area:88,bed:3,suite:1,bath:2,park:2,floor:"5º",sun:"Sul",sale:520000,condo:950,iptu:160,status:"aprovado",vis:2,quality:78,commercial:74,addr:"Av. Bernardo Vieira de Melo, 2200",bldg:"Ed. Maré Alta",ownerc:"Sra. Regina · (81) 3344-1111",auth:"sim",excl:"sim",listed:"não",docsit:"Inventário concluído",occ:"Ocupado pelo proprietário",visit:"Fins de semana",furn:"parcial",comm:"50/50 sobre 5%",desc:"3 quartos beira-mar de Piedade, varanda ampla, 2 vagas soltas."}),
      prop({id:"p3",owner:"u4",purpose:"aluguel",type:"Studio",city:"Recife",hood:"Pina",area:34,bed:1,suite:0,bath:1,park:1,floor:"14º",sun:"Poente",rent:2600,condo:620,iptu:80,status:"analise",vis:1,quality:64,commercial:70,addr:"Rua Capitão Rebelinho, 380",bldg:"Beach Class",ownerc:"—",auth:"sim",excl:"não",listed:"sim",docsit:"Declarada regular",occ:"Vazio",visit:"Livre",furn:"sim",comm:"Taxa de 1 aluguel, 50/50",desc:"Studio mobiliado no Pina, pronto para morar."}),
      prop({id:"p4",owner:"u1",purpose:"venda",type:"Casa",city:"Cabo de Santo Agostinho",hood:"Paiva",area:210,bed:4,suite:3,bath:5,park:3,floor:"—",sun:"Nascente",sale:1850000,condo:1400,iptu:520,status:"aprovado",vis:1,quality:91,commercial:88,addr:"Cond. Morada da Península, lote 12",bldg:"Reserva do Paiva",ownerc:"Sr. Fábio · (81) 3355-2222",auth:"sim",excl:"sim",listed:"não",docsit:"Escritura registrada",occ:"Vazio",visit:"Com acompanhamento",furn:"não",comm:"40/60 sobre 5% (60 captador)",desc:"Casa em condomínio fechado no Paiva, 4 suítes possíveis, piscina."}),
      prop({id:"p5",owner:"u4",purpose:"ambos",type:"Apartamento",city:"Recife",hood:"Setúbal",area:74,bed:3,suite:1,bath:2,park:1,floor:"3º",sun:"Sul",sale:460000,rent:3200,condo:850,iptu:130,status:"complemento",vis:1,quality:52,commercial:66,addr:"Rua João Cardoso Aires, 90",bldg:"—",ownerc:"—",auth:"não informado",excl:"não",listed:"sim",docsit:"Não informada",occ:"Ocupado por inquilino",visit:"A combinar",furn:"não",comm:"A combinar",desc:"3 quartos em Setúbal.",pend:"Faltam fotos complementares e confirmação de autorização do proprietário."}),
      prop({id:"p6",owner:"u1",purpose:"aluguel",type:"Sala comercial",city:"Recife",hood:"Boa Viagem",area:42,bed:0,suite:0,bath:1,park:1,floor:"7º",sun:"—",rent:2900,condo:700,iptu:110,status:"analise",vis:1,quality:71,commercial:60,addr:"Av. Domingos Ferreira, 800, sala 707",bldg:"Empresarial Blue Tower",ownerc:"—",auth:"sim",excl:"não",listed:"não",docsit:"Declarada regular",occ:"Vazio",visit:"Horário comercial",furn:"não",comm:"Taxa de 1 aluguel",desc:"Sala pronta com divisórias, ar e vaga."}),
    ],
    demands:[
      {id:"d1",user:"u2",purpose:"venda",type:"Apartamento",city:"Recife",hoods:["Boa Viagem","Setúbal"],max:430000,min:350000,bed:2,park:1,minArea:55,profile:"Casal, primeiro imóvel, crédito pré-aprovado Caixa",urgency:"Alta — decide em até 30 dias",fin:"Financiamento aprovado",notes:"Cliente prioriza quadra do mar e nascente.",status:"ativa"},
      {id:"d2",user:"u2",purpose:"venda",type:"Casa",city:"Cabo de Santo Agostinho",hoods:["Paiva"],max:2000000,min:1200000,bed:4,park:2,minArea:180,profile:"Família vinda de SP, mudança em 90 dias",urgency:"Média",fin:"À vista",notes:"Busca condomínio com segurança e lazer.",status:"ativa"},
      {id:"d3",user:"u5",purpose:"aluguel",type:"Studio",city:"Recife",hoods:["Pina","Boa Viagem"],max:3000,min:1800,bed:1,park:0,minArea:28,profile:"Executivo em contrato de 12 meses",urgency:"Alta",fin:"Aluguel",notes:"Precisa mobiliado.",status:"ativa"},
    ],
    matches:[
      {id:"m1",prop:"p1",demand:"d1",requester:"u2",captador:"u1",score:0,reason:"",status:"solicitado",form:{profile:"Casal, primeiro imóvel",range:"Até R$ 430 mil",deadline:"30 dias",credit:"Aprovado (Caixa)",mode:"Financiamento",notes:"Podem visitar no sábado."},adminNotes:""},
    ],
    logs:[
      log("u3","Aprovou CRECI","user","u1","Documento validado manualmente"),
      log("u3","Aprovou imóvel","property","p1","Nível de visibilidade 1 — blindado"),
      log("u2","Solicitou match","match","m1","Demanda d1 × imóvel p1"),
    ],
  };
}
function prop(o){ return Object.assign({rent:null,sale:null,pend:"",photos:5,mainPhoto:true,photoFlag:o.quality<60,createdAt:"2026-07-01"},o); }
function log(u,action,etype,eid,meta){ return {id:uid(),user:u,action,etype,eid,meta,at:new Date().toISOString().slice(0,16).replace("T"," ")}; }

let S;
try{ S = JSON.parse(localStorage.getItem("almatch")||"null"); }catch(e){ S=null; }
if(!S || S.v!==3) S = seed();
S.modal=null; S.wiz=S.wiz||null;
const save = () => { try{ localStorage.setItem("almatch",JSON.stringify(S)); }catch(e){} };

/* ============ motor de match ============ */
function matchScore(p,d){
  if(p.status!=="aprovado") return {score:0,reason:"Imóvel ainda não aprovado pela curadoria."};
  let s=0; const why=[], nay=[];
  const purposeOk = p.purpose===d.purpose || p.purpose==="ambos";
  purposeOk ? (s+=15,why.push(`finalidade compatível (${d.purpose})`)) : nay.push(`a demanda é de ${d.purpose} e o imóvel é de ${p.purpose}`);
  p.type===d.type ? (s+=20,why.push(`tipo ${p.type.toLowerCase()}`)) : nay.push(`a demanda pede ${d.type.toLowerCase()} e a captação é ${p.type.toLowerCase()}`);
  p.city===d.city ? (s+=10,why.push(`mesma cidade (${p.city})`)) : nay.push("cidade diferente");
  d.hoods.includes(p.hood) ? (s+=20,why.push(`bairro ${p.hood} dentro da busca`)) : nay.push(`bairro ${p.hood} fora dos bairros buscados`);
  const price = d.purpose==="aluguel" ? p.rent : p.sale;
  if(price && price<=d.max && (!d.min || price>=d.min)){ s+=20; why.push(`valor dentro da faixa (${band(price)})`); }
  else nay.push("valor fora da faixa da demanda");
  if(!d.minArea || p.area>=d.minArea){ s+=5; why.push("metragem compatível"); } else nay.push("metragem abaixo do mínimo");
  p.bed>=d.bed ? (s+=5,why.push(`${p.bed} quarto(s)`)) : nay.push(`a demanda exige ${d.bed} quartos e o imóvel possui ${p.bed}`);
  p.park>=(d.park||0) ? s+=3 : nay.push("vagas insuficientes");
  if(p.quality>=75) s+=2;
  s=Math.min(100,s);
  const reason = s>=60
    ? `Match de ${s}% porque ${why.slice(0,4).join(", ")}.${nay.length?` Ponto de atenção: ${nay[0]}.`:""}`
    : `Não houve aderência suficiente (${s}%) porque ${nay.slice(0,3).join("; ")}.`;
  return {score:s,reason};
}
S.matches.forEach(m=>{ const p=S.properties.find(x=>x.id===m.prop), d=S.demands.find(x=>x.id===m.demand); if(p&&d){const r=matchScore(p,d); m.score=r.score; m.reason=r.reason;} });

/* agentes simulados */
function agentReports(p){
  const missing=[]; if(!p.photos||p.photos<5) missing.push("mínimo de 4 fotos complementares"); if(p.auth!=="sim") missing.push("autorização do proprietário"); if(p.docsit==="Não informada") missing.push("situação documental");
  return [
    {a:"Agente de Qualidade da Captação",t:`Nota ${p.quality}/100. Pontos fortes: localização em ${p.hood}, campos essenciais preenchidos.${missing.length?" Pendências: "+missing.join("; ")+".":" Sem pendências relevantes."} Recomendação: ${p.quality>=75?"aprovar":p.quality>=55?"pedir ajuste":"recusar"}.`},
    {a:"Agente de Curadoria Comercial",t:`Nota ${p.commercial}/100. ${p.hood} está entre os bairros de atuação prioritária. Perfil provável: ${p.purpose==="aluguel"?"locatário de médio prazo":"comprador final ou investidor"}. Recomendação de exposição: nível ${p.vis} — ${p.vis===1?"blindado":p.vis===2?"parcial":"liberado"}.`},
    {a:"Agente de Segurança e Blindagem",t:`Endereço completo, proprietário e comissão marcados como privados. Nome do empreendimento ${p.vis>=2?"exibido por decisão manual":"oculto por padrão"}. Nenhum dado sensível exposto ao perfil parceiro.`},
    {a:"Agente de Comunicação",t:p.status==="complemento"?`Rascunho ao captador: "Sua captação em ${p.hood} está quase pronta. Para avançarmos na curadoria, precisamos de: ${p.pend||"complementos"}."`:`Resumo executivo: ${p.type} em ${p.hood}, ${p.purpose}, ${p.sale?band(p.sale):band(p.rent)}, qualidade ${p.quality}/100 — ${p.status==="aprovado"?"ativo para match":"em fila de curadoria"}.`},
  ];
}

/* ============ helpers de UI ============ */
const $ = s => document.querySelector(s);
const me = () => S.users.find(u=>u.id===S.session);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function go(view){ S.view=view; S.modal=null; render(); }
function setTab(k,v){ S.tab[k]=v; render(); }
window.A = {go,setTab};
function chipFor(st){ const map={aprovado:["ok",PSTATUS.aprovado],analise:["warn",PSTATUS.analise],recusado:["bad",PSTATUS.recusado],complemento:["warn",PSTATUS.complemento],arquivado:["","Arquivado"]}; const [c,t]=map[st]||["",st]; return `<span class="chip ${c}">${t}</span>`; }
function scoreBadge(s){ const c=s>=80?"hi":s>=60?"md":"lo"; return `<span class="score ${c}">${s}%</span>`; }
function esc(x){ return String(x??"").replace(/[<>&"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c])); }
function field(id,lab,inner){ return `<div><label for="${id}">${lab}</label>${inner}</div>`; }
function inp(id,lab,val="",type="text",ph=""){ return field(id,lab,`<input id="${id}" type="${type}" value="${esc(val)}" placeholder="${ph}">`); }
function sel(id,lab,opts,val){ return field(id,lab,`<select id="${id}">${opts.map(o=>`<option ${o===val?"selected":""}>${o}</option>`).join("")}</select>`); }
function photoStrip(n,flag){ let h=""; for(let i=0;i<n;i++) h+=`<div class="thumb photo-slot">${i===0?"foto<br>principal":"foto "+i}</div>`; return `<div class="row">${h}${flag?'<span class="chip warn">qualidade visual baixa</span>':""}</div>`; }

/* ============ views ============ */
function render(){
  const app=$("#app"); const u=me();
  let body="";
  if(S.view==="landing") body=vLanding();
  else if(S.view==="onboarding") body=vOnboarding();
  else if(!u) { S.view="landing"; body=vLanding(); }
  else if(S.view==="captador") body=vCaptador(u);
  else if(S.view==="wizard") body=vWizard(u);
  else if(S.view==="parceiro") body=vParceiro(u);
  else if(S.view==="admin") body=vAdmin(u);
  app.innerHTML = vTop(u) + `<main class="fade">${body}</main>` + vFooter() + (S.modal?S.modal:"");
  save();
}
function vTop(u){
  const nav = u
    ? `<span class="rolebadge">${esc(u.name)} · ${u.role==="admin"?"Admin A&L":u.role==="captador"?"Captador":"Parceiro"}</span>
       ${u.role==="captador"?`<button class="btn sm subtle" onclick="A.go('captador')">Minhas captações</button>`:""}
       ${u.role==="parceiro"?`<button class="btn sm subtle" onclick="A.go('parceiro')">Oportunidades</button>`:""}
       ${u.role==="admin"?`<button class="btn sm subtle" onclick="A.go('admin')">Painel A&L</button>`:""}
       <button class="btn sm ghost" onclick="logout()">Sair</button>`
    : `<button class="btn sm" onclick="openLogin()">Entrar com Google</button>`;
  return `<header class="topbar"><div class="wrap">
    <div class="brand" style="cursor:pointer" onclick="A.go('landing')">A<b>&amp;</b>L <span>| Match Imobiliário</span></div>
    <nav class="topnav">${nav}</nav></div></header>`;
}
function vFooter(){
  return `<footer><div class="wrap">
  <p><b>A&amp;L | Negócios Imobiliários</b> · parceria.aelimoveis.com.br · protótipo interativo</p>
  <p>A plataforma A&amp;L Parcerias Inteligentes atua como ambiente privado de organização, curadoria e aproximação comercial entre profissionais do mercado imobiliário. O envio de informações não implica aprovação automática, divulgação pública ou garantia de negociação. A responsabilidade pela veracidade das informações da captação é do corretor que realizou o cadastro, sem prejuízo da curadoria e validação interna da A&amp;L.</p>
  <p>O acesso à base de oportunidades é condicionado à validação profissional, análise documental e aprovação da A&amp;L. Informações sensíveis dos imóveis, proprietários e captadores não serão exibidas publicamente.</p>
  </div></footer>`;
}

      <button class="gbtn" onclick="login('u1')">🔑 Marina Albuquerque — Captadora validada</button>

      <button class="gbtn" onclick="login('u3')">🔑 Equipe A&amp;L — Painel administrativo</button>

window.closeModal = function(){ S.modal=null; render(); };
window.login = function(id){ S.session=id; const u=me(); S.view = u.role==="admin"?"admin":u.role; S.modal=null; render(); toast(`Sessão iniciada como ${u.name}.`); };
window.loginNew = function(){ S.session=null; S.obStep=0; S.ob={}; S.view="onboarding"; S.modal=null; render(); };
window.logout = function(){ S.session=null; S.view="landing"; render(); };

/* ---- onboarding ---- */
function vOnboarding(){
  const st=S.obStep, ob=S.ob||{};
  const bar=`<div class="progress"><i style="width:${(st+1)*25}%"></i></div>`;
  let inner="";
  if(st===0) inner=`
    <h2>Dados pessoais e profissionais</h2><p class="muted small">Login com Google confirmado como <b>novo.corretor@gmail.com</b>.</p>
    <div class="frow">${inp("ob_name","Nome completo",ob.name||"")}${inp("ob_phone","Telefone / WhatsApp",ob.phone||"","tel","(81) 9…")}</div>
    <div class="frow">${inp("ob_creci","Número do CRECI",ob.creci||"","text","CRECI-PE 00.000")}${sel("ob_city","Cidade de atuação",CITIES,ob.city||"Recife")}</div>
    ${sel("ob_role","Como você quer atuar?",["Captador — quero cadastrar imóveis","Parceiro — quero buscar oportunidades"],ob.roleLabel)}
    <div class="row" style="margin-top:18px"><span class="spacer"></span><button class="btn" onclick="obNext()">Continuar</button></div>`;
  if(st===1) inner=`
    <h2>Documento do CRECI</h2>
    <p class="muted small">Anexe PDF ou imagem legível da carteira, certidão ou documento atualizado de regularidade do CRECI. A validação é feita por análise humana da equipe A&amp;L.</p>
    <label for="ob_doc">Arquivo (PDF, JPG ou PNG · até 10 MB)</label>
    <input id="ob_doc" type="file" accept=".pdf,image/jpeg,image/png" onchange="S.ob.doc=this.files[0]?this.files[0].name:''">
    ${ob.doc?`<p class="small chip ok" style="margin-top:8px">Anexado: ${esc(ob.doc)}</p>`:""}
    <div class="row" style="margin-top:18px"><button class="btn subtle" onclick="S.obStep=0;render()">Voltar</button><span class="spacer"></span>
    <button class="btn ghost" onclick="S.ob.doc='creci-simulado.pdf';obNext()">Usar documento de exemplo</button>
    <button class="btn" onclick="obNext()">Continuar</button></div>`;
  if(st===2) inner=`
    <h2>Termos e responsabilidade</h2>
    <div class="list small muted" style="margin:10px 0">
      <p class="disclaimer">Declaro que as informações prestadas são verdadeiras e que possuo relação legítima com as captações que cadastrar. Autorizo o tratamento dos meus dados pessoais pela A&amp;L nos termos da LGPD (Lei 13.709/2018), exclusivamente para fins de validação profissional, curadoria e aproximação comercial.</p>
      <p class="disclaimer">Estou ciente de que o envio de informações não implica aprovação automática e de que dados sensíveis não serão exibidos publicamente. Posso solicitar exclusão ou arquivamento dos meus dados a qualquer momento.</p>
    </div>
    <label class="row" style="font-size:.9rem"><input type="checkbox" id="ob_terms" style="width:auto" ${ob.terms?"checked":""}> Li e aceito os termos de uso, a política de privacidade e o termo de responsabilidade.</label>
    <div class="row" style="margin-top:18px"><button class="btn subtle" onclick="S.obStep=1;render()">Voltar</button><span class="spacer"></span><button class="btn" onclick="obFinish()">Concluir cadastro</button></div>`;
  if(st===3){ const u=me(); inner=`
    <h2>Cadastro enviado para validação</h2>
    <p class="muted">Recebemos seus dados profissionais e o documento do CRECI. A equipe A&amp;L fará a análise de regularidade antes de liberar o acesso completo.</p>
    <p><span class="chip warn">CRECI pendente</span></p>
    <div class="row" style="margin-top:18px"><button class="btn" onclick="A.go('${u&&u.role==="parceiro"?"parceiro":"captador"}')">Ir para o meu painel</button></div>`; }
  return `<div class="wrap" style="max-width:640px;padding-top:40px">
    <p class="eyebrow">Onboarding profissional · etapa ${Math.min(st+1,4)} de 4</p>${bar}
    <div class="card">${inner}</div></div>`;
}
window.obNext = function(){
  const st=S.obStep; S.ob=S.ob||{};
  if(st===0){
    ["name","phone","creci","city"].forEach(k=>{const el=$("#ob_"+k); if(el) S.ob[k]=el.value;});
    S.ob.roleLabel=$("#ob_role").value;
    if(!S.ob.name||!S.ob.phone||!S.ob.creci){ toast("Preencha nome, telefone e CRECI para continuar."); return; }
  }
  if(st===1 && !S.ob.doc){ toast("Anexe o documento do CRECI para continuar."); return; }
  S.obStep=st+1; render();
};
window.obFinish = function(){
  if(!$("#ob_terms").checked){ toast("É necessário aceitar os termos para concluir."); return; }
  const role = (S.ob.roleLabel||"").startsWith("Parceiro")?"parceiro":"captador";
  const nu={id:uid(),name:S.ob.name,email:"novo.corretor@gmail.com",phone:S.ob.phone,role,creci:S.ob.creci,city:S.ob.city,creciStatus:"pendente",doc:S.ob.doc,terms:true};
  S.users.push(nu); S.session=nu.id; S.obStep=3;
  S.logs.unshift(log(nu.id,"Novo corretor cadastrado","user",nu.id,"CRECI enviado — aguardando validação"));
  render(); toast("Cadastro recebido. CRECI em análise pela A&L.");
};

/* ---- captador ---- */
function vCaptador(u){
  const mine=S.properties.filter(p=>p.owner===u.id);
  const pend = u.creciStatus!=="aprovado" ? `<div class="card" style="border-color:var(--warn)"><span class="chip warn">CRECI pendente</span><p class="small muted" style="margin-top:8px">Seu documento está em análise pela equipe A&amp;L. Você já pode cadastrar captações; elas entram na curadoria após a validação do seu CRECI.</p></div>` : "";
  const myMatches=S.matches.filter(m=>m.captador===u.id);
  return `<div class="wrap" style="padding-top:32px">
    <div class="row"><div><p class="eyebrow">Painel do captador</p><h1 style="font-size:1.7rem">Minhas captações</h1></div>
    <span class="spacer"></span><button class="btn" onclick="startWizard()">Cadastrar nova captação</button></div>
    <div class="grid g3" style="margin:20px 0">
      <div class="card kpi"><b>${mine.length}</b><span>captações</span></div>
      <div class="card kpi"><b>${mine.filter(p=>p.status==="aprovado").length}</b><span>ativas para match</span></div>
      <div class="card kpi"><b>${myMatches.length}</b><span>matches em análise pela A&amp;L</span></div>
    </div>
    ${pend}
    <div class="list" style="margin-top:16px">
      ${mine.map(p=>`<div class="card"><div class="row">
        <div><b>${p.type} · ${p.hood}, ${p.city}</b><div class="muted small">${p.bed?p.bed+" quartos · ":""}${p.area} m² · ${p.purpose}${p.sale?" · "+fmt(p.sale):""}${p.rent?" · "+fmt(p.rent)+"/mês":""}</div></div>
        <span class="spacer"></span>${chipFor(p.status)}</div>
        ${p.status==="complemento"?`<p class="small" style="color:var(--warn);margin-top:8px">Pendência apontada pela curadoria: ${esc(p.pend)}</p>`:""}
        ${photoStrip(Math.min(p.photos,5),p.photoFlag)}
      </div>`).join("") || `<div class="card muted">Você ainda não cadastrou captações.</div>`}
    </div>
    ${myMatches.length?`<h2 style="margin-top:32px">Interesse em análise</h2>
    <div class="list">${myMatches.map(m=>{const p=S.properties.find(x=>x.id===m.prop);return `<div class="card row">
      <div><b>${p.type} · ${p.hood}</b><div class="muted small">${m.status==="validado"?"Match validado — a A&L fará a ponte com o parceiro.":"Um corretor parceiro demonstrou interesse. A A&L está avaliando a aderência antes de qualquer liberação — a identidade do interessado permanece protegida."}</div></div>
      <span class="spacer"></span><span class="chip ${m.status==="validado"?"ok":"navy"}">${m.status==="validado"?"Match validado":"Match solicitado"}</span></div>`;}).join("")}</div>`:""}
  </div>`;
}

    <div class="grid g2" style="margin-top:16px">
      ${cards.map(({p,r})=>`<div class="card oppcard">
        <div class="row"><span class="loc">${p.hood} · ${p.type}</span>${d?scoreBadge(r.score):""}</div>
        <div class="facts">
          <span>${p.bed?p.bed+" quarto"+(p.bed>1?"s":""):"—"} · ${bandArea(p.area)}</span>

      </div>`).join("")}

  else if(tab==="demandas") body=vDemands(u,myDemands);
  else body=`<div class="list">
    ${myReqs.length?myReqs.map(m=>{const p=S.properties.find(x=>x.id===m.prop);return `<div class="card row">
      <div><b>${p.hood} · ${p.type}</b><div class="muted small">${m.status==="validado"?"Match validado pela A&L — nossa equipe fará a ponte e conduzirá a apresentação.":m.status==="recusado"?"A A&L avaliou e optou por não avançar neste momento."+(m.adminNotes?" Motivo: "+esc(m.adminNotes):""):"Solicitação em análise pela A&L. Antes de qualquer conexão, a A&L valida as informações."}</div></div>

    </div>`}

  if(tab==="logs") body=`<div class="scrollx card" style="padding:8px 12px"><table>
    <tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Entidade</th><th>Detalhe</th></tr>
    ${S.logs.map(l=>{const x=S.users.find(y=>y.id===l.user);return `<tr><td style="white-space:nowrap">${l.at}</td><td>${esc(x?x.name:l.user)}</td><td>${esc(l.action)}</td><td>${l.etype} ${l.eid}</td><td>${esc(l.meta)}</td></tr>`;}).join("")}</table></div>`;
  return `<div class="wrap" style="padding-top:32px">
    <p class="eyebrow">Painel administrativo A&amp;L · orquestrador ativo</p><h1 style="font-size:1.7rem">Curadoria e conexões</h1>
    <div class="tabs">${Object.entries(T).map(([k,t])=>`<button class="${tab===k?"on":""}" onclick="A.setTab('adm','${k}')">${t}</button>`).join("")}</div>
    ${body}
    <div class="row" style="margin-top:28px"><button class="btn subtle sm" onclick="localStorage.removeItem('almatch');location.reload()">Restaurar dados de demonstração</button></div>
  </div>`;
}
window.setCreci = function(id,st){
  const x=S.users.find(y=>y.id===id); x.creciStatus=st;
  S.logs.unshift(log("u3",st==="aprovado"?"Aprovou CRECI":"Recusou CRECI","user",id,`Agente de Comunicação preparou aviso de ${st==="aprovado"?"aprovação":"recusa educada"} para ${x.name}`));
  render(); toast(`CRECI de ${x.name} ${st}.`);
};
window.setProp = function(id,st){
  const p=S.properties.find(x=>x.id===id); p.status=st;
  S.logs.unshift(log("u3",st==="aprovado"?"Aprovou imóvel":st==="arquivado"?"Arquivou imóvel":"Atualizou imóvel","property",id,`${p.type} em ${p.hood} — status: ${PSTATUS[st]||st}`));
  render(); toast(`Imóvel em ${p.hood}: ${PSTATUS[st]||st}.`);
};
window.setVis = function(id,v){
  const p=S.properties.find(x=>x.id===id); p.vis=+v;
  S.logs.unshift(log("u3","Alterou visibilidade","property",id,`Nível ${v} — ${v==1?"blindado":v==2?"parcial":"liberado"}`));
  render(); toast(`Visibilidade nível ${v} aplicada.`);
};
window.askComplement = function(id){
  const p=S.properties.find(x=>x.id===id); p.status="complemento"; p.pend=p.pend||"Complementar fotos e confirmar autorização do proprietário.";
  S.logs.unshift(log("u3","Pediu complementação","property",id,"Agente de Comunicação notificou o captador"));
  render(); toast("Pedido de complementação enviado ao captador.");
};
window.openReject = function(id){
  S.modal=`<div class="modal-bg" onclick="if(event.target===this){closeModal()}"><div class="modal">
    <h2>Recusar imóvel</h2>${sel("rej_reason","Motivo padronizado",REJECT_REASONS)}
    ${field("rej_notes","Observação interna (opcional)",`<textarea id="rej_notes"></textarea>`)}
    <div class="row" style="margin-top:16px"><button class="btn subtle" onclick="closeModal()">Cancelar</button><span class="spacer"></span>
    <button class="btn danger" onclick="confirmReject('${id}')">Confirmar recusa</button></div></div></div>`;
  render();
};
window.confirmReject = function(id){
  const p=S.properties.find(x=>x.id===id); p.status="recusado"; p.pend=$("#rej_reason").value;
  S.logs.unshift(log("u3","Recusou imóvel","property",id,`Motivo: ${p.pend}. Agente de Comunicação preparou recusa educada ao captador.`));
  S.modal=null; render(); toast("Imóvel recusado com motivo registrado.");
};
window.decideMatch = function(id,st){
  const m=S.matches.find(x=>x.id===id); m.status=st;
  if(st==="recusado") m.adminNotes="Aderência insuficiente no momento.";
  S.logs.unshift(log("u3",st==="validado"?"Aprovou conexão (match validado)":"Recusou conexão","match",id,st==="validado"?"A&L conduzirá a ponte entre captador e parceiro":"Partes não conectadas — dados permanecem blindados"));
  render(); toast(st==="validado"?"Match validado. A A&L conduz a ponte entre as partes.":"Solicitação recusada.");
};
window.toast = toast;

render();
</script>
