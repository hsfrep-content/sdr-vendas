<!doctype html>
<html lang="pt-BR">
<head>

<body>
<style>
  :root{
    --navy:#101c33;
    --navy-soft:#1c2f4f;
    --paper:#eef1f5;
    --surface:#ffffff;
    --ink:#16202e;
    --muted:#5b6b80;
    --red:#9c3b2e;
    --red-soft:#c8574433;
    --line:rgba(16,28,51,.13);
    --line-strong:rgba(16,28,51,.22);
    --code-bg:#f1eee6;
    --shadow:0 1px 2px rgba(16,28,51,.06), 0 8px 24px -12px rgba(16,28,51,.18);
    --accent-link:#26436f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --navy:#0d1420;
      --navy-soft:#18233a;
      --paper:#0b0f16;
      --surface:#121a26;
      --ink:#e6ebf2;
      --muted:#94a3b8;
      --red:#d5695a;
      --red-soft:#d5695a2e;
      --line:rgba(255,255,255,.11);
      --line-strong:rgba(255,255,255,.2);
      --code-bg:#1a2230;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.6);
      --accent-link:#8fb3e8;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --navy:#0d1420; --navy-soft:#18233a; --paper:#0b0f16; --surface:#121a26;
    --ink:#e6ebf2; --muted:#94a3b8; --red:#d5695a; --red-soft:#d5695a2e;
    --line:rgba(255,255,255,.11); --line-strong:rgba(255,255,255,.2);
    --code-bg:#1a2230; --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 30px -14px rgba(0,0,0,.6);
    --accent-link:#8fb3e8; color-scheme: dark;
  }
  :root[data-theme="light"]{
    --navy:#101c33; --navy-soft:#1c2f4f; --paper:#eef1f5; --surface:#ffffff;
    --ink:#16202e; --muted:#5b6b80; --red:#9c3b2e; --red-soft:#c8574433;
    --line:rgba(16,28,51,.13); --line-strong:rgba(16,28,51,.22);
    --code-bg:#f1eee6; --shadow:0 1px 2px rgba(16,28,51,.06), 0 8px 24px -12px rgba(16,28,51,.18);
    --accent-link:#26436f; color-scheme: light;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  .serif{
    font-family: "Iowan Old Style","Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  }
  .mono{
    font-family: ui-monospace, "SFMono-Regular", "Cascadia Mono", Consolas, monospace;
    font-variant-numeric: tabular-nums;
  }

  a{color:var(--accent-link);}

  /* ---------- shell ---------- */
  .shell{
    display:grid;
    grid-template-columns: 272px minmax(0,1fr) 300px;
    grid-template-rows: 60px 1fr;
    grid-template-areas:
      "top top top"
      "side main notes";
    min-height:100vh;
  }
  @media (max-width: 1080px){
    .shell{ grid-template-columns: 240px minmax(0,1fr); grid-template-areas:
      "top top"
      "side main"; }
    .notes-rail{ display:none; }
  }
  @media (max-width: 720px){
    .shell{ grid-template-columns: 1fr; grid-template-areas: "top" "main"; }
    .side-rail{ display:none; }
  }

  .top-rail{
    grid-area: top;
    background:var(--navy);
    color:#eef1f5;
    display:flex; align-items:center; gap:16px;
    padding:0 20px;
    border-bottom:1px solid var(--line-strong);
  }
  .brand{
    display:flex; align-items:center; gap:10px;
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:19px; letter-spacing:.01em; white-space:nowrap;
  }
  .brand .mark{
    width:30px;height:30px;border-radius:7px;
    background:linear-gradient(160deg,var(--navy-soft),var(--navy));
    border:1px solid rgba(255,255,255,.18);
    display:flex;align-items:center;justify-content:center;
    font-weight:600; font-size:14px; position:relative;
  }
  .brand .mark::after{
    content:"";position:absolute; left:50%; top:16%; width:1.5px; height:68%;
    background:var(--red); transform:translateX(-1px) rotate(8deg);
  }
  .brand small{
    display:block; font-family:-apple-system,Segoe UI,sans-serif;
    font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:#aab8cc;
    margin-top:1px;
  }
  .top-search{
    flex:1; max-width:460px; margin-left:8px;
    position:relative;
  }
  .top-search input{
    width:100%; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.16);
    border-radius:8px; color:#eef1f5; padding:9px 12px 9px 34px; font-size:13.5px;
    outline:none;
  }
  .top-search input::placeholder{color:#93a2ba;}
  .top-search input:focus{border-color:var(--red); background:rgba(255,255,255,.12);}
  .top-search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.65;}
  .top-meta{
    margin-left:auto; display:flex; align-items:center; gap:10px;
    font-size:12px; color:#aab8cc; white-space:nowrap;
  }
  .status-pill{
    display:inline-flex; align-items:center; gap:6px;
    padding:4px 10px; border-radius:999px; font-size:11.5px; font-weight:600;
    letter-spacing:.02em; border:1px solid rgba(255,255,255,.18);
    background:rgba(255,255,255,.06);
  }
  .status-pill .dot{width:6px;height:6px;border-radius:50%;background:#e0a63a;}

  /* ---------- side rail ---------- */
  .side-rail{
    grid-area: side;
    background:var(--surface);
    border-right:1px solid var(--line);
    overflow-y:auto;
    padding:18px 0 24px;
  }
  .side-group-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted);
    padding:14px 18px 6px;
  }
  .side-group-label:first-child{padding-top:2px;}
  .nav-item{
    display:flex; align-items:flex-start; gap:10px;
    width:100%; text-align:left; background:none; border:none; cursor:pointer;
    padding:9px 18px; color:var(--ink); font-size:13.5px; line-height:1.35;
    border-left:2.5px solid transparent;
  }
  .nav-item:hover{background:var(--red-soft);}
  .nav-item.active{
    background:var(--red-soft);
    border-left-color:var(--red);
    font-weight:600;
  }
  .nav-badge{
    flex:none; width:24px;height:24px;border-radius:6px;
    background:var(--navy); color:#e9edf3;
    display:flex;align-items:center;justify-content:center;
    font-size:10.5px; font-weight:700; margin-top:1px;
    font-family: ui-monospace, monospace;
  }
  .nav-item.active .nav-badge{background:var(--red);}
  .nav-title small{display:block; color:var(--muted); font-size:11px; font-weight:400; margin-top:1px;}

  .side-foot{
    margin-top:10px; padding:14px 18px 0; border-top:1px solid var(--line);
    font-size:11.5px; color:var(--muted); line-height:1.5;
  }

  /* ---------- main ---------- */
  .main-rail{ grid-area:main; overflow-y:auto; }
  .doc-shell{
    max-width:760px; margin:0 auto; padding:38px 40px 90px;
  }
  .doc-head{
    border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:26px;
  }
  .doc-kicker{
    font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--red);
    font-weight:700; margin-bottom:8px;
  }
  .doc-head h1{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:30px; margin:0 0 8px; text-wrap:balance; line-height:1.18;
  }
  .doc-sub{color:var(--muted); font-size:13.5px;}

  article.doc-body{ font-size:15.5px; line-height:1.68; }
  article.doc-body h2{
    font-family:"Iowan Old Style","Palatino Linotype",Georgia,serif;
    font-size:21px; margin:34px 0 12px; padding-top:6px; text-wrap:balance;
    border-top:1px solid var(--line); padding-top:20px;
  }
  article.doc-body h2:first-child{border-top:none; margin-top:0;}
  article.doc-body h3{ font-size:16px; margin:24px 0 8px; font-weight:700; }
  article.doc-body p{ margin:0 0 14px; max-width:66ch; }
  article.doc-body ul,article.doc-body ol{ margin:0 0 16px; padding-left:22px; }
  article.doc-body li{ margin-bottom:5px; max-width:64ch; }
  article.doc-body li.task{ list-style:none; margin-left:-22px; display:flex; gap:8px; align-items:flex-start; }
  article.doc-body li.task input{ margin-top:4px; accent-color:var(--red); flex:none; }
  article.doc-body strong{ color:var(--ink); }
  article.doc-body code{
    font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
    background:var(--code-bg); padding:.12em .38em; border-radius:4px; font-size:.87em;
  }
  article.doc-body pre{
    background:var(--code-bg); border:1px solid var(--line); border-radius:8px;
    padding:14px 16px; overflow-x:auto; margin:0 0 18px;
  }
  article.doc-body pre code{ background:none; padding:0; font-size:12.6px; line-height:1.55; }
  article.doc-body blockquote{
    margin:0 0 16px; padding:10px 16px; border-left:3px solid var(--red);
    background:var(--red-soft); border-radius:0 6px 6px 0; color:var(--ink);
    font-size:14px;
  }
  article.doc-body hr{ border:none; border-top:1px solid var(--line); margin:26px 0; }
  .table-wrap{ overflow-x:auto; margin:0 0 18px; border:1px solid var(--line); border-radius:8px; }
  table{ border-collapse:collapse; width:100%; font-size:13.6px; }
  th,td{ padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  thead th{ background:var(--navy); color:#e9edf3; font-weight:600; font-size:12px; letter-spacing:.02em; }
  tbody tr:nth-child(even){ background:rgba(16,28,51,.03); }
  :root[data-theme="dark"] tbody tr:nth-child(even){ background:rgba(255,255,255,.03); }
  @media (prefers-color-scheme:dark){ tbody tr:nth-child(even){ background:rgba(255,255,255,.03); } }

  .doc-footer-nav{
    display:flex; justify-content:space-between; gap:12px; margin-top:40px; padding-top:18px;
    border-top:1px solid var(--line);
  }
  .doc-footer-nav button{
    background:var(--surface); border:1px solid var(--line-strong); color:var(--ink);
    padding:10px 14px; border-radius:8px; font-size:13px; cursor:pointer; max-width:46%;
    text-align:left; line-height:1.35;
  }
  .doc-footer-nav button:hover{ border-color:var(--red); }
  .doc-footer-nav span{ display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); margin-bottom:3px; }

  /* ---------- notes rail ---------- */
  .notes-rail{
    grid-area:notes; background:var(--surface); border-left:1px solid var(--line);
    overflow-y:auto; padding:18px 18px 30px; display:flex; flex-direction:column; gap:14px;
  }
  .notes-title{ font-size:13px; font-weight:700; display:flex; align-items:center; gap:7px; }
  .notes-title .sw{width:7px;height:7px;border-radius:50%;background:var(--red);}
  .notes-hint{ font-size:12px; color:var(--muted); line-height:1.5; margin-top:-8px; }
  textarea#note-input{
    width:100%; min-height:74px; resize:vertical; border:1px solid var(--line-strong);
    border-radius:8px; padding:9px 10px; font-size:13px; font-family:inherit; background:var(--paper);
    color:var(--ink); outline:none;
  }
  textarea#note-input:focus{ border-color:var(--red); }
  .notes-actions{ display:flex; gap:8px; }
  .btn{
    border:none; border-radius:7px; padding:8px 12px; font-size:12.5px; cursor:pointer; font-weight:600;
  }
  .btn-primary{ background:var(--red); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-ghost{ background:transparent; border:1px solid var(--line-strong); color:var(--ink); }
  .btn-ghost:hover{ border-color:var(--red); }
  .note-list{ display:flex; flex-direction:column; gap:10px; }
  .note-card{
    border:1px solid var(--line); border-radius:8px; padding:10px 11px; background:var(--paper);
    font-size:12.8px; line-height:1.5;
  }
  .note-card .meta{ display:flex; justify-content:space-between; align-items:center; margin-bottom:5px; }
  .note-card time{ color:var(--muted); font-size:10.8px; }
  .note-card button{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:11px; }
  .note-card button:hover{ color:var(--red); }
  .note-empty{ font-size:12.5px; color:var(--muted); border:1px dashed var(--line-strong); border-radius:8px; padding:16px; text-align:center; }

  /* ---------- search overlay ---------- */
  .search-overlay{
    position:fixed; inset:0; background:rgba(8,12,20,.55); display:none;
    align-items:flex-start; justify-content:center; padding-top:9vh; z-index:50;
  }
  .search-overlay.open{ display:flex; }
  .search-panel{
    width:min(640px,92vw); max-height:70vh; overflow-y:auto; background:var(--surface);
    border-radius:12px; box-shadow:var(--shadow); border:1px solid var(--line-strong);
  }
  .search-panel .sp-head{ padding:8px 10px; border-bottom:1px solid var(--line); }
  .search-panel input{
    width:100%; border:none; outline:none; font-size:15px; padding:10px 8px; background:transparent; color:var(--ink);
  }
  .sp-results{ padding:6px; }
  .sp-result{
    padding:10px 12px; border-radius:8px; cursor:pointer;
  }
  .sp-result:hover, .sp-result.sel{ background:var(--red-soft); }
  .sp-result .doc-name{ font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--red); font-weight:700; margin-bottom:2px; }
  .sp-result .snippet{ font-size:13px; color:var(--ink); line-height:1.4; }
  .sp-result mark{ background:var(--red-soft); color:var(--ink); border-radius:2px; }
  .sp-empty{ padding:24px; text-align:center; color:var(--muted); font-size:13px; }

  ::selection{ background:var(--red-soft); }
  button:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible{
    outline:2px solid var(--red); outline-offset:2px;
  }
  @media (prefers-reduced-motion: no-preference){
    .nav-item, .btn, .doc-footer-nav button{ transition: background .12s ease, border-color .12s ease, filter .12s ease; }
  }
</style>

<script type="text/markdown" id="src-readme">
Pacote de documentos preparatórios para a estruturação da parceria comercial
entre dois corretores de imóveis pessoas físicas (CRECI/PE), companheiros em
união estável, atuando sob a identificação comercial "A&L Negócios
Imobiliários", sem constituição de pessoa jurídica nesta fase.

**Nenhum documento aqui substitui validação por advogado, contador, CRECI/PE,
cartório ou prefeitura.** Ver avisos específicos em cada documento do menu ao lado.

## Como usar esta central

- **Painel** — visão geral do andamento: progresso dos checklists, etapas do plano de implantação, validações externas pendentes e situação dos riscos.
- **Documentos** — leitura e consulta dos quatro documentos, com busca global (tecla "/") e checklists clicáveis; o painel à direita registra sugestões de ajuste por documento.
- **Riscos** — gestão da matriz de riscos: cada risco tem gravidade e um status de tratamento que você atualiza conforme avança.
- **Revisão** — fluxo de revisão: status de cada documento (rascunho → em revisão → validado), triagem das sugestões registradas e exportação de um relatório completo em `.md`.
- Todo o progresso (checklists, riscos, status, sugestões) fica salvo neste navegador e pode ser exportado a qualquer momento.

## Documentos

- **Diagnóstico consolidado** — panorama jurídico, civil, penal, COFECI/CRECI, união estável, fiscal, municipal, LGPD, operacional e de marca; matriz de riscos e plano de implantação.
- **Minutas contratuais** — modelos de instrumento de parceria, autorizações, propostas, recibos e termos de parceria.
- **Checklists e políticas** — checklists operacionais e políticas internas de comissão, despesas, arquivamento, privacidade e comunicação.
- **Parecer do revisor crítico** — revisão final, riscos por gravidade e nível de segurança da entrega.

<script type="text/markdown" id="src-00">
> **Aviso geral:** este material é um estudo preparatório de estruturação, produzido a partir de premissas informadas pelos parceiros. **Não substitui** parecer de advogado, contador e demais profissionais habilitados, nem consulta formal ao CRECI/PE, cartórios e prefeituras. Onde indicado, "Este ponto exige validação final por profissional habilitado ou órgão competente antes de aplicação prática."

## 0. Premissa central (vale para todo o material)

A "A&L Negócios Imobiliários" é, nesta fase, uma **marca de atuação conjunta entre dois corretores de imóveis autônomos**, pessoas físicas, regularmente inscritos no CRECI/PE, que também são companheiros em união estável. **Não há pessoa jurídica constituída.** Nenhum documento, anúncio, contrato ou comunicação produzido a partir deste material deve dar a entender o contrário. Sempre que a estrutura evoluir para pessoa jurídica (registro de imobiliária, CNPJ, CRECI-J, enquadramento tributário), este diagnóstico deve ser revisado por completo.

Área de atuação inicial: Recife, Jaboatão dos Guararapes, Cabo de Santo Agostinho, Ipojuca/Porto de Galinhas e Tamandaré/Praia dos Carneiros — PE.

## 1. Diagnóstico jurídico-imobiliário

**Base normativa de referência:** Lei nº 6.530/1978 e Decreto nº 81.871/1978 (profissão de corretor de imóveis), Código Civil (arts. 722 a 729 — corretagem), Lei nº 8.245/1991 (locações), Lei nº 6.015/1973 (registros públicos), Código de Defesa do Consumidor quando aplicável à relação com o cliente final.

Pontos centrais:
- A intermediação (venda, locação, temporada) só deve ocorrer com **autorização escrita** do proprietário/locador, com prazo, condições e comissão definidos previamente.
- Anúncio de imóvel sem autorização expressa do titular é risco jurídico e ético (ver Seção 4).
- O direito à comissão nasce do resultado útil da intermediação (art. 725, CC) — recomenda-se documentar todo o histórico de tratativas para comprovar o nexo causal em caso de disputa.
- Cada corretor responde individualmente pelos atos que pratica; a atuação conjunta sob a marca A&L não cria, por si só, responsabilidade solidária — mas a ausência de identificação clara de "quem fez o quê" pode gerar essa interpretação em juízo ou perante o CRECI. Documentos devem sempre identificar o corretor responsável pelo atendimento.
- Pendências documentais do imóvel (ônus, dívidas, inventário, litígio) devem ser objeto de checklist prévio; a omissão de informação relevante conhecida pelo corretor gera responsabilidade civil e ética.

**Documentos necessários:** minutas de autorização de venda, autorização de locação, autorização de anúncio, proposta de compra, proposta de locação, termo de visita, recibo de comissão, declaração de ciência documental — ver documento "Minutas contratuais".

*Validação obrigatória: advogado especializado em direito imobiliário para revisão final das minutas antes do primeiro uso.*

## 2. Diagnóstico de responsabilidade civil

Riscos identificados e tratamento recomendado:

| Risco | Tratamento |
|---|---|
| Erro de informação repassada por proprietário/locador | Declaração assinada do proprietário atestando veracidade das informações; corretor não garante o conteúdo, apenas repassa com ressalva |
| Publicidade do imóvel | Autorização de anúncio assinada previamente; sem promessas de valorização/rentabilidade |
| Guarda de documentos e chaves | Termo de recebimento/devolução com data, hora e assinatura |
| Visitas | Termo de visita assinado por todos os presentes, com identificação |
| Intermediação de valores (sinal, caução) | Como regra, **não custodiar valores de terceiros**; direcionar para conta do proprietário, imobiliária depositária ou instrumento formal (ver seção Penal/Fiscal) |
| Desistência de proposta aceita | Cláusula de arras e comissão devida por resultado útil, conforme minuta |
| Vício oculto do imóvel | Corretor não responde por vício técnico da construção; declarar isso expressamente e recomendar vistoria/laudo técnico próprio do interessado |
| Conflito comprador x vendedor / locador x locatário | Corretor atua como intermediário, não como parte; toda comunicação relevante deve ser registrada por escrito (e-mail/WhatsApp com histórico preservado) |
| Responsabilidade solidária indevida entre os dois parceiros | Cada atendimento deve identificar o corretor responsável; o Instrumento de Parceria deve prever expressamente que a responsabilidade por erro técnico/ético é individual, ressalvada a comissão compartilhada |

Recomenda-se política de arquivamento: todo atendimento gera uma pasta (física/digital) com documentos, prints de conversas relevantes e assinaturas — retenção mínima sugerida de 5 anos (prazo geral de prescrição civil, art. 206, CC), **a confirmar com advogado conforme o tipo de obrigação**.

## 3. Diagnóstico penal e antifraude

Riscos relevantes: estelionato (art. 171, CP), falsidade ideológica/documental (arts. 297–299, CP), apropriação indébita (art. 168, CP), lavagem de dinheiro (Lei nº 9.613/1998).

Diretrizes preventivas:
1. **Nunca receber valores de terceiros (sinal, caução, comissão de terceiros) em conta pessoal dos corretores**, salvo estrutura formalizada com orientação jurídica específica — risco de caracterização de apropriação indébita ou intermediação irregular de recursos.
2. Validar identidade e titularidade do imóvel antes de qualquer captação: certidão de matrícula atualizada, comparação de dados do "proprietário" com o registro, documento de identidade.
3. Redobrar cautela em: procurações (verificar validade, poderes e se não há revogação), inventários/espólios (verificar alvará judicial ou anuência de todos os herdeiros), imóveis em litígio, vendas por terceiro alegando urgência ou pressa incomum, pagamento fora do circuito bancário, uso de criptoativos.
4. Registrar e preservar toda a documentação recebida (data, origem, meio de recebimento).
5. Qualquer indício de irregularidade documental deve suspender a negociação até orientação de advogado.

*Este ponto exige validação final por profissional habilitado antes de aplicação prática, especialmente quanto a operações de valor elevado ou origem não identificada.*

## 4. Diagnóstico COFECI/CRECI/PE e ética profissional

- Toda peça publicitária deve trazer nome e número de CRECI de cada corretor responsável — a marca "A&L" pode aparecer como identificação comercial conjunta, mas **nunca isoladamente sem a identificação dos corretores e respectivos CRECI**, para não sugerir existência de imobiliária constituída.
- Uso da marca A&L deve vir acompanhado de texto do tipo: *"A&L Negócios Imobiliários é a marca de atuação conjunta de [Nome 1], corretor de imóveis CRECI/PE nº ____, e [Nome 2], corretor de imóveis CRECI/PE nº ____."*
- Captação com exclusividade deve ser expressa e por escrito; parceria/divisão de comissão com outros corretores ou imobiliárias deve ser formalizada previamente (co-corretagem), respeitando a vedação a aliciamento de clientela alheia.
- Deveres éticos: informação, lealdade, sigilo, boa concorrência (Código de Ética do COFECI — Resolução vigente, **a confirmar a versão atualizada junto ao CRECI/PE**).
- Quando a operação crescer (contratação de terceiros, ponto comercial fixo, volume relevante, necessidade de CNPJ para nota fiscal/parcerias com construtoras), avaliar constituição de pessoa jurídica com CRECI-J — ponto de decisão futura, não presente.

*Validação obrigatória junto ao CRECI/PE quanto às normas vigentes de publicidade e uso de marca comercial por corretores autônomos em parceria.*

## 5. Diagnóstico de direito de família / união estável / sociedade de fato

Pontos de atenção:
- União estável e parceria profissional são relações jurídicas distintas; a ausência de separação documental entre elas é a maior fonte de risco patrimonial do projeto.
- Sem instrumento próprio, a atuação conjunta e continuada, com divisão de lucros, pode ser interpretada como **sociedade de fato**, sujeitando os parceiros a regras de sociedade (inclusive responsabilidade patrimonial) mesmo sem registro — é justamente o que se busca evitar ou, alternativamente, disciplinar de forma controlada.
- Recomenda-se instrumento particular específico ("Instrumento Particular de Parceria Operacional entre Corretores Pessoas Físicas") tratando: divisão de comissões (por atendimento próprio x conjunto), rateio de despesas, titularidade da marca A&L, tratamento da carteira de clientes/captações em caso de dissolução da parceria profissional e/ou da união estável, e regra de não confusão entre patrimônio comum do casal e receitas/despesas da atividade profissional.
- Regime de bens da união estável (comunhão parcial, salvo contrato de convivência diverso) incide sobre o patrimônio pessoal do casal, mas **não deve ser confundido** com a divisão operacional de comissões entre corretores — recomenda-se que o instrumento de parceria seja tratado como acordo de natureza profissional, com cláusula de independência em relação ao regime de bens da união estável.
- Em caso de dissolução de qualquer uma das duas relações (profissional e/ou afetiva), recomenda-se cláusula de encerramento amigável com prazo, forma de partilha de comissões pendentes e destino da marca A&L.

*Este ponto exige validação final por advogado de família/patrimonial, especialmente quanto à interação entre o regime de bens e o instrumento de parceria.*

## 6. Diagnóstico fiscal e contábil (pessoa física)

- Comissão de corretagem recebida por pessoa física é rendimento tributável pelo IRPF via **carnê-leão** mensal (recebimento de pessoa física ou de pessoa jurídica sem retenção) e declarado anualmente; se a fonte pagadora for pessoa jurídica, pode haver retenção na fonte, a apurar caso a caso.
- Cada corretor deve emitir **recibo próprio** de sua comissão (identificando CPF e CRECI); comissões divididas entre os dois devem ser documentadas por recibos individuais correspondentes à parte de cada um, evitando que um receba pelo outro sem lastro documental.
- Recomenda-se livro-caixa (dedução de despesas necessárias à atividade: marketing, deslocamento, ferramentas) e contribuição ao INSS como contribuinte individual/autônomo, conforme opção de cada corretor.
- Contas bancárias e controles financeiros da atividade devem ser **segregados** das contas pessoais/familiares do casal, com rateio documentado de despesas comuns da operação.
- Ponto de decisão futura: a partir de determinado volume de receita/operações, avaliar migração para pessoa jurídica (ex.: Simples Nacional, CRECI-J), o que pode reduzir carga tributária e formalizar a relação comercial — decisão a ser tomada com contador, considerando faturamento projetado.

*Este ponto exige validação final por contador antes de aplicação prática (apuração de carnê-leão, dedutibilidade de despesas, enquadramento previdenciário).*

## 7. Diagnóstico municipal (ITBI, cartórios, registros) — por praça

**Aviso crítico:** alíquotas de ITBI, prazos, taxas, exigências documentais e valores de referência mudam por lei municipal e por atualização periódica de cada prefeitura. **Nenhum percentual ou valor deve ser informado ao cliente sem confirmação prévia, na data da operação, junto à prefeitura/cartório competente.** Abaixo, apenas o roteiro de verificação por município — não os valores.

| Município | O que confirmar antes de orientar o cliente |
|---|---|
| Recife/PE | Alíquota vigente de ITBI e base de cálculo (valor de transação x valor venal de referência), portal de emissão de guia, certidões municipais exigidas, situação de IPTU |
| Jaboatão dos Guararapes/PE | Idem acima junto à Secretaria de Finanças municipal |
| Cabo de Santo Agostinho/PE | Idem acima; atenção a áreas de expansão urbana/industrial com regras específicas de parcelamento do solo |
| Ipojuca/PE (Porto de Galinhas) | Idem acima; **atenção a terrenos de marinha e áreas de faixa de praia (União/SPU)** — possível incidência de laudêmio e foro, regularização junto à Secretaria de Patrimônio da União |
| Tamandaré/PE (Praia dos Carneiros) | Idem acima; mesma atenção a terrenos de marinha, unidades de conservação e restrições ambientais/costeiras aplicáveis à região |

Checklist genérico de escritura/registro (válido para todos os municípios, a confirmar exigências locais):
- [ ] Certidão de matrícula atualizada (30 dias)
- [ ] Certidões negativas do vendedor (cíveis, trabalhistas, fiscais, protesto)
- [ ] Guia de ITBI paga/quitada antes da lavratura da escritura
- [ ] Certidão de quitação de IPTU e taxas municipais
- [ ] Escritura pública em tabelionato de notas (salvo hipóteses de instrumento particular com força de escritura, ex. SFH)
- [ ] Registro da escritura no Cartório de Registro de Imóveis da circunscrição do imóvel
- [ ] Em áreas de marinha/União: consulta prévia à SPU sobre laudêmio, foro e situação de aforamento/ocupação

*Este ponto exige validação final junto à prefeitura, cartório de notas, cartório de registro de imóveis e, quando aplicável, à SPU, antes de qualquer orientação vinculante ao cliente.*

## 8. Diagnóstico LGPD e proteção de dados

- Dados tratados: nome, CPF, RG, contato, comprovante de residência, matrícula do imóvel, contratos, imagens do imóvel — alguns com potencial sensibilidade (ex. dados financeiros para qualificação de comprador/locatário).
- Base legal predominante: execução de procedimentos preliminares e de contrato a pedido do titular (art. 7º, V, LGPD) e legítimo interesse limitado à finalidade de intermediação — **evitar coleta de dados além do necessário**.
- Canais usados (WhatsApp, e-mail, planilhas, Drive/CRM) devem ter controle de acesso, e os documentos de clientes não devem ficar em dispositivos pessoais sem proteção mínima (senha, criptografia de disco, backup controlado).
- Prazo de retenção: manter apenas pelo tempo necessário à finalidade e ao cumprimento de obrigação legal/prescricional; descarte seguro após esse prazo.
- Compartilhamento com terceiros (cartórios, bancos, outros corretores, imobiliárias parceiras) deve ser o mínimo necessário e informado ao titular.
- Recomenda-se política de privacidade simples publicada nos canais de atendimento e cláusula LGPD padrão em todos os contratos/fichas.

## 9. Diagnóstico operacional

Fluxo-base recomendado: **Captação → Validação documental → Precificação → Autorização (venda/locação/anúncio) → Divulgação → Atendimento/Qualificação de lead → Visita → Proposta → Negociação → Fechamento → Documentação/Registro → Comissão → Pós-venda/pós-locação → Arquivamento.**

Cada etapa deve gerar um documento mínimo (ficha, termo ou registro), detalhado no documento "Checklists e políticas", garantindo rastreabilidade em caso de disputa futura.

## 10. Diagnóstico de marketing, comunicação e marca

- Comunicação deve sempre identificar os corretores individualmente (nome + CRECI), com a marca A&L como identificação conjunta — nunca sugerindo "imobiliária" ou "empresa" formal enquanto não houver PJ.
- Proibido/alto risco: "investimento garantido", "valorização certa", "rentabilidade garantida", "melhor oportunidade da região", prazos de retorno prometidos, comparação depreciativa com concorrentes.
- Permitido, com cautela: descrição objetiva do imóvel, localização, características, preço (se autorizado pelo proprietário), fotos/vídeos com autorização de uso de imagem do imóvel e, se houver pessoas, das pessoas retratadas.
- Identidade visual (logomarca "A&L", variações Principal/Demandas/Parceiros) pode ser usada normalmente como marca comercial conjunta, desde que sempre acompanhada da identificação dos corretores responsáveis nos materiais que gerem obrigação (contratos, propostas, autorizações) — nos materiais puramente institucionais (ex. post de rede social) recomenda-se ao menos o CRECI de ambos em rodapé/bio.

## 11. Matriz geral de riscos (síntese)

| Risco | Gravidade | Tratamento primário |
|---|---|---|
| Confusão entre marca A&L e "imobiliária constituída" | Alto | Identificação obrigatória dos corretores e CRECI em toda peça |
| Sociedade de fato não desejada | Alto | Instrumento de Parceria Operacional formalizado |
| Confusão patrimonial entre união estável e atividade profissional | Alto | Segregação de contas e cláusulas específicas no instrumento de parceria |
| Recebimento de valores de terceiros em conta pessoal | Crítico | Política de não custódia de valores de terceiros |
| Anúncio/captação sem autorização escrita | Alto | Autorizações padronizadas antes de qualquer divulgação |
| Fraude documental/imóvel litigioso | Crítico | Checklist antifraude e validação documental prévia |
| Informalidade fiscal | Médio | Carnê-leão, recibos individuais, contador |
| Erro sobre custos municipais (ITBI, laudêmio) informado ao cliente | Alto | Nunca informar valor sem confirmação no órgão competente na data da operação |
| LGPD — vazamento/uso indevido de dados | Médio | Controles de acesso, retenção mínima, política de privacidade |
| Publicidade enganosa | Alto | Guia de comunicação permitida/proibida |

## 12. Plano de implantação em etapas

1. Validar minutas e políticas com advogado e contador (obrigatório antes do uso).
2. Assinar o Instrumento Particular de Parceria Operacional entre os dois corretores.
3. Regularizar identificação da marca A&L em todos os canais (bio, assinatura, materiais).
4. Implantar checklists de captação, autorização e antifraude antes do primeiro atendimento.
5. Estruturar controle financeiro segregado (conta/planilha da operação, separada da conta pessoal do casal).
6. Definir fluxo de arquivamento documental (Drive/CRM) com política de retenção e backup.
7. Publicar política de privacidade básica e cláusula LGPD nos contratos.
8. Revisar periodicamente (sugestão: a cada 6 meses ou a cada mudança relevante de volume) a necessidade de constituição de pessoa jurídica.

## Política de comissionamento (síntese operacional)

1. Toda comissão decorre de autorização escrita prévia (venda/locação).
2. Divisão entre os parceiros segue o Instrumento de Parceria Operacional (atendimento individual vs. conjunto).
3. Comissão com terceiros (co-corretagem, imobiliárias parceiras) exige termo de parceria específico antes do início da negociação conjunta.
4. Pagamento sempre mediante recibo individual, nunca em nome da "A&L" como se pessoa jurídica fosse.
5. Nenhuma comissão deve ser descontada diretamente de valores de terceiros (sinal, caução) custodiados pelo(s) corretor(es).

## Política de despesas e rateio

1. Despesas comuns da operação (tráfego pago, ferramentas/CRM, fotografia, contabilidade, deslocamento a atendimentos conjuntos) são rateadas conforme percentual do Instrumento de Parceria.
2. Despesas de atendimento individual correm por conta de quem as gerou, salvo acordo diverso registrado por escrito.
3. Reembolsos exigem comprovante e lançamento no controle financeiro mensal.
4. Prestação de contas mensal entre os parceiros, com fechamento e registro simples (planilha/DRE simplificado).

## Política de arquivamento documental

1. Cada atendimento gera uma pasta digital nomeada `AAAA-MM_[Endereço-resumido]_[Tipo]` (ex.: `2026-07_RuaX-Boa-Viagem_Venda`).
2. Conteúdo mínimo: autorização assinada, ficha de captação, documentos do imóvel, propostas, termo(s) de visita, contrato final, recibo de comissão, prints/registros de comunicações relevantes.
3. Retenção sugerida: mínimo 5 anos após o encerramento do atendimento (prazo geral de prescrição civil — *confirmar com advogado prazo aplicável ao caso concreto*).
4. Backup em nuvem com controle de acesso; descarte seguro ao final do prazo de retenção.

## Política de privacidade / LGPD (síntese)

1. Coleta de dados limitada ao necessário para a intermediação em curso.
2. Base legal: execução de procedimentos preliminares/contratuais e, residualmente, legítimo interesse restrito à finalidade comercial.
3. Compartilhamento apenas com quem participa diretamente do negócio (cartórios, bancos, outro corretor/imobiliária parceira formalizada).
4. Armazenamento em ferramentas com controle de acesso (Drive/CRM com senha, sem compartilhamento público de pastas).
5. Retenção conforme política de arquivamento; descarte seguro após o prazo.
6. Direitos do titular (acesso, correção, exclusão) atendidos mediante solicitação, ressalvada retenção obrigatória por prazo legal/prescricional.

## Guia de comunicação comercial (permitido x proibido)

**Permitido, com cautela:**
- Descrição objetiva do imóvel (metragem, quartos, localização, características)
- Preço, se autorizado pelo proprietário
- Fotos/vídeos com autorização de uso de imagem

- Uso da marca A&L isoladamente sem identificação dos corretores/CRECI, de forma a sugerir imobiliária constituída
- Divulgação de endereço/preço sem autorização expressa do proprietário/locador

<script type="text/markdown" id="src-03">
**Objeto revisado:** Diagnóstico consolidado, Minutas contratuais, Checklists e políticas.

## Resumo do que foi revisado

Diagnóstico jurídico, civil, penal/antifraude, COFECI/CRECI, família/união estável, fiscal, municipal, LGPD, operacional e de marketing; onze minutas contratuais; checklists de captação, venda, locação, fechamento, antifraude, fiscal e municipal; políticas de comissionamento, despesas, arquivamento, privacidade e comunicação.

## Principais riscos encontrados

1. **Crítico — recebimento de valores de terceiros.** Reforçado em múltiplos documentos que sinal, caução e comissão nunca devem transitar por conta pessoal dos corretores sem lastro formal. Ponto tratado corretamente nas minutas; risco residual permanece caso a prática real diverja do documento — depende de disciplina operacional, não apenas de cláusula.
2. **Alto — confusão entre marca A&L e pessoa jurídica.** Todas as minutas e o guia de comunicação exigem identificação nominal dos corretores e CRECI. Ponto adequadamente coberto, mas exige fiscalização contínua sobre o material publicitário efetivamente publicado (redes sociais, portais) — o documento não tem como garantir a execução prática.
3. **Alto — confusão patrimonial entre união estável e parceria profissional.** O Instrumento de Parceria trata o tema, mas a cláusula de "independência em relação ao regime de bens" é uma diretriz contratual entre as partes; **não tem o condão de afastar, por si só, efeitos do regime de bens legalmente aplicável perante terceiros ou em eventual litígio**. Isso deve ficar claro aos parceiros.
4. **Médio-alto — dados municipais (ITBI, laudêmio) não numéricos.** Decisão correta de não informar alíquotas/valores no material, mas isso significa que **nenhuma orientação de custo ao cliente pode ser dada com base neste documento** — deve ser destacado como limitação prática relevante do material, não apenas nota de rodapé.
5. **Médio — prazo de retenção documental (5 anos) é estimativa genérica**, baseada em prazo geral de prescrição civil; prazos específicos variam conforme o tipo de obrigação (ex. questões fiscais, trabalhistas se houver contratação futura de terceiros) e não foram individualizados.
6. **Médio — Código de Ética do COFECI citado sem número de resolução vigente.** O material evita citar resolução desatualizada, mas isso deixa a validação normativa integralmente pendente de consulta ao CRECI/PE.
7. **Baixo — minutas usam linguagem-modelo com campos em colchetes.** Adequado para uso como rascunho, mas nenhuma deve ser assinada sem preenchimento revisado por advogado, sob risco de cláusula inconsistente com o caso concreto (ex. tipo de arras, se confirmatórias ou penitenciais).

## Pontos aprovados

- Premissa central (pessoa física/parceria, não PJ) mantida de forma consistente em todos os documentos.
- Separação clara, em cada seção, entre o que é regra atual (PF/parceria) e o que é gatilho para migração futura a PJ.
- Política de não custódia de valores de terceiros presente de forma reiterada (diagnóstico, minutas e checklists).
- Identificação individual do corretor responsável exigida em fichas, autorizações e recibos, mitigando risco de responsabilidade solidária indevida.
- Nenhuma promessa de rentabilidade/valorização nas minutas ou no guia de comunicação.
- Avisos de validação profissional presentes nos pontos fiscal, municipal, penal e de família/patrimonial.

## Pontos que precisam de ajuste

- Incluir, no Instrumento de Parceria, cláusula explícita informando às partes que a segregação patrimonial contratual **não é oponível automaticamente a credores ou ao cônjuge/companheiro perante o regime de bens legal**, cabendo orientação de advogado sobre eventual necessidade de contrato de convivência complementar.
- Destacar, em local visível do diagnóstico municipal, que o documento **não deve ser usado para informar custos ao cliente final** sem confirmação prévia e atualizada.
- Especificar, antes do primeiro uso real, o tipo de arras (confirmatórias/penitenciais) na Proposta de Compra, hoje deixado em aberto — decisão que depende de orientação jurídica e de política comercial dos parceiros.

## Pontos que exigem validação profissional externa (reforço)

- **Advogado:** todas as minutas antes do primeiro uso; regime de bens e efeitos patrimoniais da união estável frente à parceria; prazo de retenção documental por tipo de obrigação.
- **Contador:** apuração de carnê-leão, dedutibilidade de despesas, enquadramento previdenciário, momento de eventual migração para pessoa jurídica.
- **CRECI/PE:** normas atualizadas de publicidade, uso de marca comercial conjunta por autônomos e código de ética vigente.
- **Cartório/prefeitura/SPU:** toda alíquota, prazo, certidão e eventual laudêmio/foro, caso a caso, na data da operação.

## Recomendações finais

1. Tratar este material como **rascunho de trabalho**, não como conjunto de documentos prontos para uso.
2. Submeter o Instrumento de Parceria e o conjunto de minutas a advogado antes de qualquer assinatura.
3. Submeter a rotina fiscal a contador antes do primeiro recebimento de comissão.
4. Confirmar, a cada operação, dados municipais atualizados diretamente com o órgão competente.
5. Revisar este pacote documental sempre que houver mudança relevante de volume de operações, entrada de terceiros na parceria, ou decisão de constituir pessoa jurídica.

## Nível de segurança da entrega

**Condicionado.** O material está estruturalmente coerente com a premissa central e cobre as frentes solicitadas, mas sua aplicação prática depende integralmente da validação pelos profissionais e órgãos indicados nas seções de cada documento. Nenhuma peça deve ser usada em operação real sem essa validação.

  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function mdToHtml(md, docId){
    var lines = md.replace(/\r\n/g,"\n").split("\n");
    var html = []; var i = 0; var taskCounter = 0;
    while (i < lines.length){
      var line = lines[i];
      if (/^\s*$/.test(line)){ i++; continue; }
      if (/^```/.test(line)){
        var code = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])){ code.push(lines[i]); i++; }
        i++;
        html.push("<pre><code>" + esc(code.join("\n")) + "</code></pre>");
        continue;
      }
      var h = line.match(/^(#{1,3})\s+(.*)$/);
      if (h){ var lv = h[1].length + 1; html.push("<h"+lv+">"+inline(h[2])+"</h"+lv+">"); i++; continue; }
      if (/^---+\s*$/.test(line)){ html.push("<hr>"); i++; continue; }
      if (/^\s*\|/.test(line)){
        var rows = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
        var parsed = rows.filter(function(r){ return !/^[\s|:-]+$/.test(r); }).map(function(r){
          return r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(function(c){ return c.trim(); });
        });
        if (parsed.length){
          var t = '<div class="table-wrap"><table><thead><tr>';
          parsed[0].forEach(function(c){ t += "<th>"+inline(c)+"</th>"; });
          t += "</tr></thead><tbody>";
          parsed.slice(1).forEach(function(r){
            t += "<tr>"; r.forEach(function(c){ t += "<td>"+inline(c)+"</td>"; }); t += "</tr>";
          });
          t += "</tbody></table></div>";
          html.push(t);
        }
        continue;
      }
      if (/^\s*>\s?/.test(line)){
        var q = [];
        while (i < lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
        html.push("<blockquote>"+inline(q.join(" "))+"</blockquote>");
        continue;
      }
      if (/^\s*-\s\[[ xX]\]\s/.test(line)){
        var items = [];
        while (i < lines.length && /^\s*-\s\[[ xX]\]\s/.test(lines[i])){
          items.push(lines[i].match(/^\s*-\s\[([ xX])\]\s(.*)$/)[2]); i++;
        }
        var ul = "<ul>";
        items.forEach(function(txt){
          taskCounter++;
          var key = docId + "-t" + taskCounter;
          ul += '<li class="task"><input type="checkbox" data-task="'+key+'" '+(state.tasks[key]?"checked":"")+'><span>'+inline(txt)+"</span></li>";
        });
        html.push(ul + "</ul>");
        continue;
      }
      if (/^\s*-\s/.test(line)){
        var ui = [];
        while (i < lines.length && /^\s*-\s/.test(lines[i]) && !/^\s*-\s\[[ xX]\]\s/.test(lines[i])){
          ui.push(lines[i].replace(/^\s*-\s/,"")); i++;
        }
        html.push("<ul>"+ui.map(function(t){ return "<li>"+inline(t)+"</li>"; }).join("")+"</ul>");

      if (/^\s*\d+\.\s/.test(line)){
        var oi = [];
        while (i < lines.length && /^\s*\d+\.\s/.test(lines[i])){ oi.push(lines[i].replace(/^\s*\d+\.\s/,"")); i++; }
        html.push("<ol>"+oi.map(function(t){ return "<li>"+inline(t)+"</li>"; }).join("")+"</ol>");
        continue;
      }
      var para = [line]; i++;
      while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(#{1,3}\s)|^```|^\s*\||^\s*>|^\s*-\s|^\s*\d+\.\s|^---+\s*$/.test(lines[i])){
        para.push(lines[i]); i++;
      }
      html.push("<p>"+inline(para.join(" "))+"</p>");
    }
    return html.join("\n");
  }

  function kpi(label, valueHtml, pctVal, good, go){
    var bar = (pctVal === null) ? "" : '<div class="k-bar"><i style="width:'+pctVal+'%"></i></div>';
    return '<div class="kpi'+(good?" k-good":"")+'" data-go="'+go+'" role="button" tabindex="0">' +
      '<div class="k-label">'+label+'</div><div class="k-value">'+valueHtml+'</div>'+bar+'</div>';
  }

  function riskSummary(){
    var out = '<div class="step-list">';
    ["critico","alto","medio"].forEach(function(sev){
      var list = RISKS.filter(function(r){ return r.sev === sev; });
      if (!list.length) return;
      var open = list.filter(function(r){ return (state.risks[r.id] || "aberto") !== "mitigado"; }).length;
      out += '<div class="step" style="cursor:default"><span class="sev sev-'+sev+'">'+SEV_LABEL[sev]+'</span>' +
        '<span>'+list.length+' risco(s) · '+open+' em aberto · '+(list.length-open)+' mitigado(s)</span></div>';
    });
    return out + '</div>';
  }

  // ---------- view: riscos ----------
  function renderRisks(){
    var f = state.riskFilter;
    var list = RISKS.filter(function(r){
      if (f === "todos") return true;
      if (f === "abertos") return (state.risks[r.id] || "aberto") !== "mitigado";
      return r.sev === f;
    });
    var html = '<div class="app-shell">' +
      '<h1>Matriz de riscos</h1>' +
      '<div class="app-sub">Os 10 riscos da matriz geral do diagnóstico, com status de tratamento gerenciável. Marcar um risco como "mitigado" registra sua avaliação interna — não substitui a validação profissional indicada no documento de origem.</div>' +
      '<div class="risk-filters">' +
        chip("todos","Todos ("+RISKS.length+")") + chip("abertos","Em aberto") +
        chip("critico","Críticos") + chip("alto","Altos") + chip("medio","Médios") +
      '</div><div class="card">' +
      (list.length ? list.map(function(r){
        var st = state.risks[r.id] || "aberto";
        var d = docById(r.doc);
        return '<div class="risk-row">' +
          '<span class="sev sev-'+r.sev+'">'+SEV_LABEL[r.sev]+'</span>' +
          '<div><div class="r-title">'+esc(r.title)+'</div><div class="r-treat">'+esc(r.treat)+'</div>' +
          '<div class="r-doc" data-open-doc="'+r.doc+'">Ver em: '+esc(d.title)+'</div></div>' +
          '<select class="st-select s-'+st+'" data-risk="'+r.id+'">' +
            Object.keys(RISK_STATUS).map(function(k){
              return '<option value="'+k+'"'+(k===st?" selected":"")+'>'+RISK_STATUS[k]+'</option>';
            }).join("") +
          '</select></div>';
      }).join("") : '<div class="empty-hint">Nenhum risco neste filtro.</div>') +
      '</div></div>';

    Array.prototype.forEach.call(mainEl().querySelectorAll(".chip"), function(c){
      c.addEventListener("click", function(){ state.riskFilter = c.getAttribute("data-f"); renderRisks(); });
    });
    Array.prototype.forEach.call(mainEl().querySelectorAll("select[data-risk]"), function(sel){
      sel.addEventListener("change", function(){
        state.risks[sel.getAttribute("data-risk")] = sel.value; save(K.risks, state.risks); renderRisks();
      });
    });
    Array.prototype.forEach.call(mainEl().querySelectorAll("[data-open-doc]"), function(el){
      el.addEventListener("click", function(){ state.currentDoc = el.getAttribute("data-open-doc"); setView("docs"); });
    });
  }
  function chip(f, label){
    return '<button class="chip'+(state.riskFilter===f?" on":"")+'" data-f="'+f+'">'+label+'</button>';

  // ---------- view: revisão ----------
  function renderReview(){
    var html = '<div class="app-shell">' +
      '<h1>Fluxo de revisão</h1>' +
      '<div class="app-sub">Acompanhe o status de cada documento no ciclo de validação profissional e faça a triagem das sugestões registradas na aba Documentos. Marque um documento como "Validado" somente após a revisão do profissional responsável.</div>' +
      '<div class="card"><h2>Status dos documentos</h2><div class="c-sub">Rascunho → Em revisão profissional → Ajustes solicitados → Validado.</div>';

    REVIEW_DOCS.forEach(function(d){
      var st = state.docst[d.id] || "rascunho";
      var notesForDoc = state.notes.filter(function(n){ return n.doc === d.id; });
      var openForDoc = notesForDoc.filter(function(n){ return n.status === "aberta" || n.status === "aceita"; }).length;
      html += '<div class="rev-doc-row"><div>' +
        '<div class="d-name">'+esc(d.title)+'</div>' +
        '<div class="d-meta">'+notesForDoc.length+' sugestão(ões) · '+openForDoc+' em aberto</div></div>' +

    html += '</div>';

      html += '<div class="empty-hint">Nenhuma sugestão registrada ainda. Use o painel "Notas e sugestões" na aba Documentos.</div>';

      state.notes.slice().sort(function(a,b){ return b.at - a.at; }).forEach(function(n){
        var d = docById(n.doc) || { title:n.doc };
        html += '<div class="sug-card"><div class="s-head">' +
          '<span class="s-doc">'+esc(d.title)+'</span>' +

          '<span class="tag tag-'+n.status+'">'+NOTE_STATUS[n.status]+'</span>' +

          '<div>'+esc(n.text).replace(/\n/g,"<br>")+'</div>' +
          '<div class="s-actions">' +
            (n.status!=="aceita" && n.status!=="aplicada" ? '<button data-ns="aceita" data-id="'+n.id+'">Aceitar</button>' : "") +
            (n.status!=="aplicada" ? '<button data-ns="aplicada" data-id="'+n.id+'">Marcar aplicada</button>' : "") +
            (n.status!=="descartada" ? '<button data-ns="descartada" data-id="'+n.id+'">Descartar</button>' : "") +
            (n.status!=="aberta" ? '<button data-ns="aberta" data-id="'+n.id+'">Reabrir</button>' : "") +

    html += '</div>';

    html += '<div class="card"><h2>Relatório</h2>' +
      '<div class="c-sub">Exporta um relatório completo em Markdown — status dos documentos, plano, validações, riscos e todas as sugestões — para levar ao advogado/contador ou para eu aplicar as edições no repositório.</div>' +
      '<button class="btn btn-primary" id="export-report">Exportar relatório .md</button></div>';

    html += '<div class="card"><h2>Backup dos dados</h2>' +
      '<div class="c-sub">Todo o progresso (checklists, riscos, status, sugestões) fica salvo apenas neste navegador. Exporte um backup em <code>.json</code> para guardar ou levar para outro computador, e importe-o lá para restaurar exatamente o mesmo estado.</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn btn-ghost" id="export-data">Exportar dados .json</button>' +
      '<button class="btn btn-ghost" id="import-data">Importar dados .json</button>' +
      '<input type="file" id="import-file" accept=".json,application/json" style="display:none">' +
      '</div><div class="c-sub" id="import-msg" style="margin:8px 0 0"></div></div>';

    html += '</div>';
    mainEl().innerHTML = html;

    Array.prototype.forEach.call(mainEl().querySelectorAll("select[data-docst]"), function(sel){
      sel.addEventListener("change", function(){
        state.docst[sel.getAttribute("data-docst")] = sel.value; save(K.docst, state.docst); renderReview();
      });
    });
    Array.prototype.forEach.call(mainEl().querySelectorAll("button[data-ns]"), function(b){
      b.addEventListener("click", function(){
        var n = state.notes.filter(function(x){ return String(x.id) === b.getAttribute("data-id"); })[0];
        if (n){ n.status = b.getAttribute("data-ns"); save(K.notes, state.notes); renderReview(); }
      });
    });
    Array.prototype.forEach.call(mainEl().querySelectorAll("button[data-del-note]"), function(b){
      b.addEventListener("click", function(){
        state.notes = state.notes.filter(function(x){ return String(x.id) !== b.getAttribute("data-del-note"); });
        save(K.notes, state.notes); renderReview();
      });
    });
    var ex = document.getElementById("export-report");
    if (ex) ex.addEventListener("click", exportReport);

    var exd = document.getElementById("export-data");
    if (exd) exd.addEventListener("click", exportData);
    var imd = document.getElementById("import-data");
    var imf = document.getElementById("import-file");
    if (imd && imf){
      imd.addEventListener("click", function(){ imf.click(); });
      imf.addEventListener("change", function(){
        var f = imf.files && imf.files[0];
        if (!f) return;
        var reader = new FileReader();
        reader.onload = function(){
          var msg = document.getElementById("import-msg");
          try{
            var data = JSON.parse(reader.result);
            if (!data || data.app !== "al-central") throw new Error("formato");
            state.tasks = data.tasks || {}; save(K.tasks, state.tasks);
            state.risks = data.risks || {}; save(K.risks, state.risks);
            state.plan = data.plan || {}; save(K.plan, state.plan);
            state.valid = data.valid || {}; save(K.valid, state.valid);
            state.docst = data.docst || {}; save(K.docst, state.docst);
            state.notes = data.notes || []; save(K.notes, state.notes);
            renderReview();
            var m2 = document.getElementById("import-msg");
            if (m2) m2.textContent = "Backup importado com sucesso em " + new Date().toLocaleString("pt-BR") + ".";
          }catch(e){
            if (msg) msg.textContent = "Arquivo inválido: selecione um backup .json exportado por este app.";
          }
          imf.value = "";
        };
        reader.readAsText(f);
      });
    }
  }

  function exportData(){
    var data = {
      app:"al-central", version:2, exportedAt:new Date().toISOString(),
      tasks:state.tasks, risks:state.risks, plan:state.plan,
      valid:state.valid, docst:state.docst, notes:state.notes
    };
    var d = new Date();
    var stamp = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    var blob = new Blob([JSON.stringify(data, null, 2)], { type:"application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "al-backup-" + stamp + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function exportReport(){
    var tp = taskProgress(), pp = planProgress(), vp = validProgress();
    var out = "# Relatório de revisão — A&L Negócios Imobiliários\n\n";
    out += "Gerado em " + new Date().toLocaleString("pt-BR") + ". Material de trabalho — não substitui validação profissional.\n\n";
    out += "## Andamento\n\n";
    out += "- Plano de implantação: " + pp.done + "/" + pp.total + " etapas\n";
    out += "- Checklists operacionais: " + tp.done + "/" + tp.total + " itens\n";
    out += "- Validações externas: " + vp.done + "/" + vp.total + "\n\n";
    out += "## Status dos documentos\n\n";
    REVIEW_DOCS.forEach(function(d){
      out += "- " + d.title + ": **" + DOC_STATUS[state.docst[d.id] || "rascunho"] + "**\n";
    });
    out += "\n## Plano de implantação\n\n";
    PLAN.forEach(function(s, idx){ out += "- [" + (state.plan["p"+idx] ? "x" : " ") + "] " + s + "\n"; });
    out += "\n## Validações externas\n\n";
    VALIDATIONS.forEach(function(v, idx){ out += "- [" + (state.valid["v"+idx] ? "x" : " ") + "] **" + v.who + "** — " + v.text + "\n"; });
    out += "\n## Riscos\n\n| Risco | Gravidade | Status |\n|---|---|---|\n";
    RISKS.forEach(function(r){
      out += "| " + r.title + " | " + SEV_LABEL[r.sev] + " | " + RISK_STATUS[state.risks[r.id] || "aberto"] + " |\n";
    });
    out += "\n## Sugestões\n\n";
    if (!state.notes.length) out += "_Nenhuma sugestão registrada._\n";
    REVIEW_DOCS.concat([docById("readme")]).forEach(function(d){
      var list = state.notes.filter(function(n){ return n.doc === d.id; });
      if (!list.length) return;
      out += "### " + d.title + "\n\n";
      list.forEach(function(n){
        out += "- [" + NOTE_STATUS[n.status] + " · " + (NOTE_TYPE[n.tipo] || "Ajuste") + "] (" +
          new Date(n.at).toLocaleString("pt-BR") + ") " + n.text.replace(/\n/g," ") + "\n";
      });
      out += "\n";
    });
    downloadMd(out, "al-relatorio-revisao.md");
  }
  function downloadMd(content, name){
    var blob = new Blob([content], { type:"text/markdown" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- busca global ----------
  var searchIndex = DOCS.map(function(d){ return { id:d.id, title:d.title, text:docSrc(d.id) }; });
  function runSearch(q){
    var out = document.getElementById("sp-results");
    if (!q || q.length < 2){ out.innerHTML = '<div class="sp-empty">Digite ao menos 2 letras.</div>'; return; }
    var re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig");
    var results = [];
    searchIndex.forEach(function(doc){
      var m, count = 0;
      while ((m = re.exec(doc.text)) && count < 4){
        count++;
        var s = Math.max(0, m.index - 55), e = Math.min(doc.text.length, m.index + q.length + 55);
        results.push({ docId:doc.id, docTitle:doc.title,
          snippet:(s>0?"…":"") + doc.text.slice(s,e).replace(/\s+/g," ").trim() + (e<doc.text.length?"…":"") });
      }
    });
    if (!results.length){ out.innerHTML = '<div class="sp-empty">Nada encontrado para “'+esc(q)+'”.</div>'; return; }
    out.innerHTML = results.map(function(r, idx){
      return '<div class="sp-result'+(idx===0?" sel":"")+'" data-doc="'+r.docId+'">' +
        '<div class="doc-name">'+r.docTitle+'</div>' +
        '<div class="snippet">'+esc(r.snippet).replace(re, function(mm){ return "<mark>"+mm+"</mark>"; })+'</div></div>';
    }).join("");
    Array.prototype.forEach.call(out.querySelectorAll(".sp-result"), function(el){
      el.addEventListener("click", function(){
        closeSearch();
        state.currentDoc = el.getAttribute("data-doc");
        setView("docs");
      });
    });
  }
  function openSearch(){
    document.getElementById("search-overlay").classList.add("open");
    var input = document.getElementById("search-input");
    input.value = ""; runSearch("");
    setTimeout(function(){ input.focus(); }, 10);
  }
  function closeSearch(){ document.getElementById("search-overlay").classList.remove("open"); }
  document.getElementById("search-trigger").addEventListener("click", openSearch);
  document.getElementById("search-overlay").addEventListener("click", function(e){
    if (e.target.id === "search-overlay") closeSearch();
  });
  document.getElementById("search-input").addEventListener("input", function(e){ runSearch(e.target.value); });
  document.addEventListener("keydown", function(e){
    if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA"){
      e.preventDefault(); openSearch();
    }
    if (e.key === "Escape") closeSearch();
  });

  setView("panel");
})();
</script>

</body>
</html>
